name = "synetica-website"
main = "worker.js"
compatibility_date = "2025-12-08"

# Serve static assets from the current directory. Source and config files are
# excluded via .assetsignore — without it, /worker.js and /wrangler.toml are
# publicly downloadable.
[assets]
directory = "."
not_found_handling = "404-page"

[observability]
enabled = true

# Cloudflare Email Service binding for the contact and careers forms.
# Add `remote = true` temporarily to send real email during `wrangler dev`
# (note: ArrayBuffer attachments don't work in remote dev — deploy to test
# the résumé upload).
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@synetica.us"]

# SyneticaBot (/syneticabot) talks to the Tier 1 support Worker over a Service
# Binding, so the tier chain stays off the public internet and the browser only
# ever calls same-origin /api/bot/* URLs.
[[services]]
binding = "TIER1_SERVICE"
service = "tier-1-support-worker-telegram"

# Per-IP rate-limit counters and one-time Turnstile verification marks for
# SyneticaBot. Short-lived keys only — nothing here is durable state.
[[kv_namespaces]]
binding = "BOT_RATE_LIMIT_KV"
id = "2f91ffbab82a45f280dc47df56ce39c8"

[vars]
# Must be on a domain onboarded to Email Sending (`wrangler email sending
# enable synetica.us`). Until then, sends fall back to Resend.
EMAIL_FROM = "noreply@synetica.us"
CONTACT_TO = "info@synetica.us"
CAREERS_TO = "careers@synetica.us"

# Turnstile widget sitekey for the SyneticaBot page (public — the secret half is
# TURNSTILE_SECRET_KEY, set via `wrangler secret put`).
TURNSTILE_SITEKEY = "0x4AAAAAAEOVWcrH4pdoXAqg"
