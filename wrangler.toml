name = "synetica-website"
main = "worker.js"
compatibility_date = "2025-12-08"

# Serve static assets from the current directory. Source and config files are
# excluded via .assetsignore — without it, /worker.js and /wrangler.toml are
# publicly downloadable.
[assets]
directory = "."
not_found_handling = "404-page"

[observability]
enabled = true

# Cloudflare Email Service binding for the contact and careers forms.
# Add `remote = true` temporarily to send real email during `wrangler dev`
# (note: ArrayBuffer attachments don't work in remote dev — deploy to test
# the résumé upload).
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@synetica.us"]

[vars]
# Must be on a domain onboarded to Email Sending (`wrangler email sending
# enable synetica.us`). Until then, sends fall back to Resend.
EMAIL_FROM = "noreply@synetica.us"
CONTACT_TO = "info@synetica.us"
CAREERS_TO = "careers@synetica.us"
